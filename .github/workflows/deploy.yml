name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ======================================================================
      # Step 1: Build WASM Module
      # ======================================================================
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.21'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten installation
        run: |
          emcc --version
          em++ --version

      - name: Configure CMake with Emscripten
        run: |
          emcmake cmake -S . -B build-wasm \
            -DBUILD_WASM=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM target
        run: cmake --build build-wasm --target av2_wasm -j

      - name: Copy WASM artifacts to web/public
        run: |
          mkdir -p web/public/wasm
          cp build-wasm/src/wasm/av2-parser.js web/public/wasm/
          cp build-wasm/src/wasm/av2-parser.wasm web/public/wasm/
          ls -lah web/public/wasm/

      # ======================================================================
      # Step 2: Build Frontend
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build  # web/dist/

      # ======================================================================
      # Step 3: Prepare and Upload for GitHub Pages
      # ======================================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web/dist

  # ========================================================================
  # Deployment Job
  # ========================================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
