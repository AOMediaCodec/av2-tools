name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code 
      uses: actions/checkout@v6

    - name: Build
      run: |
        cmake -S . -B build
        cmake --build build -j

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure
