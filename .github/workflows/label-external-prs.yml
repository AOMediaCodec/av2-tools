name: Label external PRs

# Uses pull_request_target so the token can write labels on fork PRs.
# This workflow must never check out or run code from the PR.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.type === 'Bot') return;

            // Every member of the AOMediaCodec org is an AOM member.
            const internal = ['OWNER', 'MEMBER'];
            if (internal.includes(pr.author_association)) return;

            const label = 'external-contributor';
            const marker = '<!-- external-contributor-notice -->';
            const {owner, repo} = context.repo;

            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd93f0b',
                description: 'Author is not a member of the AOMediaCodec organization',
              });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number, labels: [label],
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: marker + '\n' +
                'This PR is from a contributor who is not a member of the AOMediaCodec ' +
                'organization. STF maintainers: please confirm the contributor is a member ' +
                'of the STF working group of AOMedia before reviewing or merging.',
            });
